name: promote

# Automatic promotion (D-103). Moves `main` (production) forward to `preview`
# with no human step when every check passes. The owner reviews only major
# changes, which this workflow holds and reports.
#
#   decide   Git-only rules in web/scripts/promotion/decide.mjs: fast-forward,
#            soak (6 h data-only, 24 h otherwise), no commit marked
#            "Owner-Review: required", no protected path, no new secret.
#   verify   On the exact candidate commit: the full test suite (lint, data
#            tests, gated build, browser tests); a fresh certification that
#            reproduces the committed SEC data; and the page-structure guard,
#            which compares headings, sections, navigation and routes with
#            production and holds any difference for the owner.
#   promote  Fast-forwards `main`. Runs no repository code.
#   report   One issue for failures, one for changes waiting on the owner.
#            Each closes itself when the condition clears. Normal states
#            (nothing to promote, still soaking) end green.

on:
  schedule:
    - cron: '47 */4 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: promote
  cancel-in-progress: false

jobs:
  decide:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      action: ${{ steps.rules.outputs.action }}
      sha: ${{ steps.rules.outputs.sha }}
      data_only: ${{ steps.rules.outputs.data_only }}
      reasons: ${{ steps.rules.outputs.reasons }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: preview
          fetch-depth: 0
          persist-credentials: false
      - name: Apply the promotion rules
        id: rules
        run: |
          set -euo pipefail
          git rev-parse --verify -q origin/main >/dev/null || { echo "::error::origin/main missing from the checkout"; exit 1; }
          # The rules come from main (already promoted, so already reviewed), never from the
          # candidate: a change on preview cannot rewrite the rules that judge it.
          git show origin/main:web/scripts/promotion/decide.mjs > "$RUNNER_TEMP/decide.mjs"
          node "$RUNNER_TEMP/decide.mjs"
          action=$(grep '^action=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2)
          case "$action" in
            none) echo "::notice::Nothing to promote: main already matches preview." ;;
            wait) echo "::notice::Soaking; the next run will check again." ;;
            hold) echo "::warning::Major change waiting for the owner." ;;
            fail) echo "::error::main cannot fast-forward to preview."; exit 1 ;;
          esac

  verify:
    needs: decide
    if: needs.decide.outputs.action == 'promote'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      reproduced: ${{ steps.recert.outputs.reproduced }}
      structure_changed: ${{ steps.structure.outputs.changed }}
      structure_diff: ${{ steps.structure.outputs.diff }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.decide.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Full test suite on the candidate
        working-directory: web
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm test
      - name: Fresh certification reproduces the committed data
        id: recert
        working-directory: web
        run: |
          set -euo pipefail
          cp src/data/generated/certifiedCoverage.json "$RUNNER_TEMP/committed.json"
          npm run certify:sec
          npm run certify:gate
          out=$(node scripts/certify-changed.mjs "$RUNNER_TEMP/committed.json" src/data/generated/certifiedCoverage.json)
          git checkout -- src/data/generated
          if [ "$out" = "changed=false" ]; then echo "reproduced=true" >> "$GITHUB_OUTPUT"
          else
            # SEC has newer data than the candidate. Not a failure: the next refresh
            # commits it, and that commit is promoted after its own soak.
            echo "::notice::SEC has newer data than the candidate; waiting for the next refresh."
            echo "reproduced=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build production for comparison
        if: steps.recert.outputs.reproduced == 'true'
        run: |
          set -euo pipefail
          git worktree add -q "$RUNNER_TEMP/prod" origin/main
          cd "$RUNNER_TEMP/prod/web"
          npm ci --no-audit --no-fund
          npm run build
      - name: Page-structure guard
        if: steps.recert.outputs.reproduced == 'true'
        id: structure
        working-directory: web
        # The guard runs from production's copy, for the same reason as the rules.
        run: node "$RUNNER_TEMP/prod/web/scripts/promotion/structure.mjs" "$RUNNER_TEMP/prod/web/dist" dist

  promote:
    needs: [decide, verify]
    if: needs.decide.outputs.action == 'promote' && needs.verify.outputs.reproduced == 'true' && needs.verify.outputs.structure_changed == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.decide.outputs.sha }}
          fetch-depth: 0
      - name: Fast-forward main
        env:
          SHA: ${{ needs.decide.outputs.sha }}
        run: git push origin "$SHA:refs/heads/main"

  report:
    needs: [decide, verify, promote]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open, update or close the promotion issues
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DECIDE: ${{ needs.decide.result }}
          VERIFY: ${{ needs.verify.result }}
          PROMOTE: ${{ needs.promote.result }}
          ACTION: ${{ needs.decide.outputs.action }}
          SHA: ${{ needs.decide.outputs.sha }}
          REASONS: ${{ needs.decide.outputs.reasons }}
          STRUCTURE: ${{ needs.verify.outputs.structure_changed }}
          STRUCTURE_DIFF: ${{ needs.verify.outputs.structure_diff }}
        run: |
          set -euo pipefail
          find_issue() { gh issue list -R "$REPO" --state open --search "\"$1\" in:title" --json number,title --jq "map(select(.title==\"$1\")) | .[0].number // empty"; }
          raise() { n=$(find_issue "$1"); if [ -n "$n" ]; then gh issue comment "$n" -R "$REPO" -b "$2"; else gh issue create -R "$REPO" -t "$1" -b "$2"; fi; }
          close_issue() { n=$(find_issue "$1"); if [ -n "$n" ]; then gh issue close "$n" -R "$REPO" -c "Cleared: $RUN_URL"; fi; }

          failed=false
          for r in "$DECIDE" "$VERIFY" "$PROMOTE"; do
            case "$r" in failure|cancelled) failed=true ;; esac
          done
          if [ "$failed" = true ]; then
            raise "Automatic promotion failed" "A promotion run failed. Production is unchanged. Run: $RUN_URL (decide: $DECIDE, verify: $VERIFY, promote: $PROMOTE)."
          else
            close_issue "Automatic promotion failed"
          fi

          preview="https://security-market-pulse-git-preview-pikeholdings.vercel.app"
          if [ "$ACTION" = hold ]; then
            raise "Owner review needed" "Preview has a major change that waits for the owner before it goes live.

          $REASONS

          Preview: $preview
          Candidate: \`$SHA\`
          To publish: \`git checkout main && git merge --ff-only preview && PROMOTE=1 git push origin main\`, or ask an agent to promote. Run: $RUN_URL"
          elif [ "$STRUCTURE" = true ]; then
            raise "Owner review needed" "The page structure changed against production, so this waits for the owner.

          $STRUCTURE_DIFF

          Preview: $preview
          Candidate: \`$SHA\`
          Run: $RUN_URL"
          elif [ "$ACTION" = none ] || [ "$PROMOTE" = success ]; then
            close_issue "Owner review needed"
          fi
