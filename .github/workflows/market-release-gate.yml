name: independent daily release gate

on:
  push:
    branches: [preview]
    paths: ['ops/ci/gate-request.json']
  workflow_dispatch:
    inputs:
      archive_commit:
        description: Immutable evidence archive commit
        required: true
        type: string
      manifest_sha256:
        description: Evidence archive manifest SHA-256
        required: true
        type: string

permissions: {}
concurrency:
  group: independent-market-release-gate
  cancel-in-progress: false

jobs:
  gate:
    # Preview can exercise the same gate before cutover. The publisher's
    # GitHubAuthority independently requires main and rejects preview artifacts.
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/preview'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          path: application
      - name: Check input formats
        id: request
        env:
          EVENT_NAME: ${{ github.event_name }}
          ARCHIVE_COMMIT: ${{ inputs.archive_commit }}
          MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
        run: |
          python3 - <<'PY'
          import json,os,re
          from pathlib import Path
          if os.environ['EVENT_NAME'] == 'push':
              request = json.loads(Path('application/ops/ci/gate-request.json').read_text())
              commit, manifest = request['archiveCommit'], request['manifestSha256']
          else:
              commit, manifest = os.environ['ARCHIVE_COMMIT'], os.environ['MANIFEST_SHA256']
          assert isinstance(commit,str) and re.fullmatch(r'[a-f0-9]{40}',commit)
          assert isinstance(manifest,str) and re.fullmatch(r'[a-f0-9]{64}',manifest)
          with open(os.environ['GITHUB_OUTPUT'],'a') as output:
              output.write('archive_commit=' + commit + '\nmanifest_sha256=' + manifest + '\n')
          PY
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jessepike/sec-market-private
          ssh-key: ${{ secrets.SMP_EVIDENCE_DEPLOY_KEY }}
          ref: ${{ steps.request.outputs.archive_commit }}
          persist-credentials: false
          path: evidence
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: application/web/package-lock.json
      - name: Verify archive root and complete evidence integrity
        env:
          MANIFEST_SHA256: ${{ steps.request.outputs.manifest_sha256 }}
        run: |
          python3 - <<'PY'
          import os,sys
          sys.path.insert(0,'application/web/scripts/pipeline')
          from archive import GitArchive
          GitArchive.verify('evidence',os.environ['MANIFEST_SHA256'])
          PY
      - name: Install pinned dependencies and browser
        timeout-minutes: 8
        working-directory: application/web
        run: |
          npm ci --no-audit --no-fund
          CI=true node scripts/ensure-test-browser.mjs
      - name: Reconstruct, certify and test the candidate
        env:
          CI: 'true'
          SMP_ARCHIVE_COMMIT: ${{ steps.request.outputs.archive_commit }}
          SMP_ARCHIVE_MANIFEST_SHA256: ${{ steps.request.outputs.manifest_sha256 }}
        run: python3 application/web/scripts/pipeline/gate.py --repo application --state evidence/state --destination "$RUNNER_TEMP/daily-gate"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: daily-market-gate
          path: ${{ runner.temp }}/daily-gate
          if-no-files-found: error
          retention-days: 7
      - name: Preserve public-source test diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: daily-gate-diagnostics
          path: ${{ runner.temp }}/daily-gate/*.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Capture production and exact tested build for owner review
        working-directory: application/web
        run: |
          mkdir -p "$RUNNER_TEMP/daily-gate-shots"
          node scripts/serve-built.mjs &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          ready=false
          for attempt in $(seq 1 30); do
            if curl --fail --silent --max-time 2 http://127.0.0.1:4173/ >/dev/null; then ready=true; break; fi
            kill -0 "$server" || { echo '::error::Exact tested-build server exited'; exit 1; }
            sleep 1
          done
          [ "$ready" = true ] || { echo '::error::Exact tested-build server did not become ready'; exit 1; }
          node scripts/shot.mjs https://securitymarketpulse.com/ "$RUNNER_TEMP/daily-gate-shots/production"
          node scripts/shot.mjs http://127.0.0.1:4173/ "$RUNNER_TEMP/daily-gate-shots/tested"
      - name: Retain visual review captures
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: daily-market-gate-screenshots
          path: ${{ runner.temp }}/daily-gate-shots
          if-no-files-found: error
          retention-days: 7
