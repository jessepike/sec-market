name: dedicated subscription account setup

on:
  push:
    branches: [preview]
    paths: ['ops/ci/bootstrap-request.json']
  workflow_dispatch:

permissions: {}
concurrency:
  group: sec-market-subscription-account
  cancel-in-progress: false

jobs:
  initialize:
    if: github.repository == 'jessepike/sec-market' && github.event.repository.private == true && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[bootstrap-account]'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Install the exact official account client
        run: |
          npm install --prefix "$RUNNER_TEMP/smp-cli" --no-save --package-lock=false @openai/codex@0.163.0
          echo "$RUNNER_TEMP/smp-cli/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Verify bootstrap and persistence guards
        run: python3 -m unittest discover -s ops/ci -p 'test_*.py' -v
      - name: Official dedicated sign-in and protected auth persistence
        env:
          GH_TOKEN: ${{ github.token }}
          SMP_AUTH_STORE_TOKEN: ${{ secrets.SMP_AUTH_STORE_TOKEN }}
        run: python3 ops/ci/bootstrap.py --root "$RUNNER_TEMP/smp-bootstrap" --output "$RUNNER_TEMP/smp-bootstrap-receipt.json"
      - name: Retain only the nonsecret setup receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dedicated-account-setup-receipt
          path: ${{ runner.temp }}/smp-bootstrap-receipt.json
          if-no-files-found: error
          retention-days: 14
      - name: Remove the ephemeral login files
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/smp-bootstrap"
