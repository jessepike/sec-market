name: freshness probe

# AUTO-002 Phase 1. Watches the certified refresh and the live site. The
# weekly signed issue was retired (D-93), so this no longer reads the issue
# index. It answers two questions:
#   1. Has certified-refresh.yml run in the last 10 hours? (It is scheduled
#      every 4 hours; GitHub can delay or drop scheduled runs.)
#   2. Does the live site answer?
# When either answer is no it opens (or updates) one GitHub issue, which reaches
# the owner's phone. A run that completed but was held below 100% is reported
# by certified-refresh.yml itself.

on:
  schedule:
    - cron: '41 */6 * * *'
  workflow_dispatch:

permissions: {}

env:
  SITE: https://securitymarketpulse.com
  MAX_HOURS: '10'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      issues: write
    steps:
      - name: Measure
        id: measure
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          problems=""
          last=$(gh run list -R "$REPO" --workflow certified-refresh.yml --limit 1 --json createdAt,conclusion,url --jq '.[0] // empty')
          if [ -z "$last" ]; then
            problems="No run of certified-refresh.yml exists yet."
          else
            created=$(echo "$last" | jq -r .createdAt)
            hours=$(( ( $(date -u +%s) - $(date -u -d "$created" +%s) ) / 3600 ))
            echo "last certified refresh: $created ($hours h ago), $(echo "$last" | jq -r .conclusion)"
            if [ "$hours" -gt "$MAX_HOURS" ]; then problems="The certified refresh last ran **$hours hours** ago ($created). It is scheduled every 4 hours. Check that the workflow is enabled under Actions."; fi
          fi
          code=$(curl -sS -o /dev/null -w '%{http_code}' "$SITE/" || echo 000)
          if [ "$code" != "200" ]; then problems="$problems The live site returned HTTP $code."; fi
          if [ -z "$problems" ]; then echo "state=fresh" >> "$GITHUB_OUTPUT"; else echo "state=stale" >> "$GITHUB_OUTPUT"; fi
          { echo "detail<<EOF"; echo "${problems:-Certified refresh ran within $MAX_HOURS hours and the site answered 200.}"; echo "EOF"; } >> "$GITHUB_OUTPUT"

      - name: Raise or clear the alert
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          STATE: ${{ steps.measure.outputs.state }}
          DETAIL: ${{ steps.measure.outputs.detail }}
        run: |
          set -euo pipefail
          title="Site freshness"
          number=$(gh issue list -R "$REPO" --state open --label freshness --json number,title --jq "map(select(.title==\"$title\")) | .[0].number // empty")
          if [ "$STATE" = "fresh" ]; then
            if [ -n "$number" ]; then gh issue comment "$number" -R "$REPO" --body "Recovered. $DETAIL"; gh issue close "$number" -R "$REPO"; fi
            exit 0
          fi
          if [ -n "$number" ]; then
            gh issue comment "$number" -R "$REPO" --body "Still stale. $DETAIL"
          else
            gh label create freshness -R "$REPO" --description "Site freshness probe" --color d93f0b 2>/dev/null || true
            gh issue create -R "$REPO" --title "$title" --label freshness --body "$DETAIL

          This issue closes itself when both checks pass again."
          fi
