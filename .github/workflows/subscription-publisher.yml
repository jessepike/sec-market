name: daily exact-artifact publisher

on:
  schedule:
    - cron: '23 0,6,16 * * *'
  workflow_dispatch:
  workflow_run:
    workflows: ['bounded subscription collector']
    types: [completed]

permissions: {}
jobs:
  callback-preflight:
    if: github.event_name == 'workflow_run'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      actions: read
    outputs:
      ready: ${{ steps.inspect.outputs.ready }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false
      - id: inspect
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json,os,sys
          sys.path.insert(0,'ops/ci')
          from publish import callback_ready
          ready=callback_ready(json.load(open(os.environ['GITHUB_EVENT_PATH'])))
          with open(os.environ['GITHUB_OUTPUT'],'a') as output:
              output.write('ready='+str(ready).lower()+'\n')
          PY
  publish:
    needs: [callback-preflight]
    if: ${{ !cancelled() && github.repository == 'jessepike/sec-market' && github.event.repository.private == true && github.ref == 'refs/heads/main' && (github.event_name != 'workflow_run' || needs.callback-preflight.outputs.ready == 'true') }}
    concurrency:
      # Skipped/read-only callbacks never replace a pending collector.
      group: sec-market-subscription-account
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: write
      actions: write # Dispatch/read the independent main gate and exact artifact.
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Initialize nonsecret setup receipt
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          (Path(os.environ['RUNNER_TEMP']) / 'smp-publish-receipt.json').write_text(json.dumps({'published': False, 'reason': 'RUNNER_SETUP_NOT_COMPLETED'}) + '\n')
          PY
      - name: Install pinned publisher and document reader
        run: |
          sudo apt-get update -qq
          sudo apt-get install --yes --no-install-recommends poppler-utils
          npm install --prefix "$RUNNER_TEMP/smp-vercel-cli" --no-save --package-lock=false vercel@64.7.0
          echo "$RUNNER_TEMP/smp-vercel-cli/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Verify operational guards
        run: python3 -m unittest discover -s ops/ci -p 'test_*.py' -v
      - name: Restore acknowledged evidence and publish through independent gate
        env:
          GH_TOKEN: ${{ github.token }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          gh auth setup-git --hostname github.com
          python3 ops/ci/publish.py --root "$RUNNER_TEMP/smp-publication" --output "$RUNNER_TEMP/smp-publish-receipt.json"
      - name: Retain nonsecret publication receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: daily-publication-receipt
          path: ${{ runner.temp }}/smp-publish-receipt.json
          if-no-files-found: error
          retention-days: 14
      - name: Report failure or recovery to the owner
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: python3 ops/ci/job_alert.py --job publisher --status "$JOB_STATUS"
      - name: Remove ephemeral publisher credentials and evidence
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/smp-publication"
