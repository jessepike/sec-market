name: daily exact-artifact publisher

on:
  schedule:
    # Completion callbacks remain primary. Keep one daily recovery timer.
    - cron: '23 16 * * *'
  workflow_dispatch:
  workflow_run:
    # The gate's completion publishes the release this workflow requested
    # (split release: no job waits while the gate runs).
    workflows: ['bounded subscription collector', 'independent daily release gate']
    types: [completed]

permissions: {}
jobs:
  callback-preflight:
    if: github.event_name == 'workflow_run'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      actions: read
    outputs:
      ready: ${{ steps.inspect.outputs.ready }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false
      - id: inspect
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json,os,sys
          sys.path.insert(0,'ops/ci')
          from publish import callback_ready
          ready=callback_ready(json.load(open(os.environ['GITHUB_EVENT_PATH'])))
          with open(os.environ['GITHUB_OUTPUT'],'a') as output:
              output.write('ready='+str(ready).lower()+'\n')
          PY
  publish:
    needs: [callback-preflight]
    if: ${{ !cancelled() && github.repository == 'jessepike/sec-market' && github.ref == 'refs/heads/main' && (github.event_name != 'workflow_run' || needs.callback-preflight.outputs.ready == 'true') }}
    concurrency:
      # Skipped/read-only callbacks never replace a pending collector.
      group: sec-market-subscription-account
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: write
      actions: write # Dispatch/read the independent main gate and exact artifact.
    outputs:
      gate_run: ${{ steps.released.outputs.gate_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Free runner disk for the evidence archive
        # The restored archive and its mirror are about 6.5 GB and grow about
        # 200 MB a day; the runner image leaves about 12 GB free. Deleting the
        # unused Android SDK, .NET and Haskell toolchains frees about 20 GB.
        # It runs in the background so it adds no time to the 35-minute limit.
        continue-on-error: true
        run: |
          df -B1 --output=avail "$RUNNER_TEMP" | tail -1
          nohup sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup >/dev/null 2>&1 &
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Initialize nonsecret setup receipt
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          (Path(os.environ['RUNNER_TEMP']) / 'smp-publish-receipt.json').write_text(json.dumps({'published': False, 'reason': 'RUNNER_SETUP_NOT_COMPLETED'}) + '\n')
          PY
      - name: Install pinned publisher and document reader
        run: |
          sudo apt-get update -qq
          sudo apt-get install --yes --no-install-recommends poppler-utils
          npm install --prefix "$RUNNER_TEMP/smp-vercel-cli" --no-save --package-lock=false vercel@64.7.0
          echo "$RUNNER_TEMP/smp-vercel-cli/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Verify operational guards
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 ops/ci/verified_ci_guards.py
      - name: Restore acknowledged evidence and publish through independent gate
        env:
          GH_TOKEN: ${{ github.token }}
          SMP_EVIDENCE_DEPLOY_KEY: ${{ secrets.SMP_EVIDENCE_DEPLOY_KEY }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          gh auth setup-git --hostname github.com
          bash ops/ci/evidence_key.sh
          python3 ops/ci/publish.py --root "$RUNNER_TEMP/smp-publication" --output "$RUNNER_TEMP/smp-publish-receipt.json"
      - id: released
        name: Name the gate run of an acknowledged release
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          receipt = json.loads((Path(os.environ['RUNNER_TEMP']) / 'smp-publish-receipt.json').read_text())
          publication = receipt.get('publication') or {}
          gate = publication.get('githubRunId')
          if publication.get('published') is True and type(gate) is int and gate > 0:
              with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
                  output.write(f'gate_run={gate}\n')
          PY
      - name: Retain nonsecret publication receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: daily-publication-receipt
          path: ${{ runner.temp }}/smp-publish-receipt.json
          if-no-files-found: error
          retention-days: 14
      - name: Report failure or recovery to the owner
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: python3 ops/ci/job_alert.py --job publisher --status "$JOB_STATUS"
      - name: Remove ephemeral publisher credentials and evidence
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/smp-publication"
  preview-data:
    # Preview builds from the data committed on its branch. After a release is
    # acknowledged, copy the data the gate accepted to preview so the preview
    # URL shows current figures. It never touches main or production, uses no
    # secret, and skips when preview's own checks would refuse the data.
    needs: [publish]
    if: ${{ !cancelled() && needs.publish.outputs.gate_run != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # Push the accepted data files to preview only.
      actions: read # Read the gate run and its artifact.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
          path: application
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: preview
          path: preview
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Copy the accepted data to preview
        env:
          GH_TOKEN: ${{ github.token }}
          GATE_RUN: ${{ needs.publish.outputs.gate_run }}
        run: python3 application/ops/ci/preview_data.py --repo preview --gate-run "$GATE_RUN"
