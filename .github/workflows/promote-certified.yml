name: promote certified data

# AUTO-002 (D-88): moves certified, data-only changes from `preview` to `main`
# with no human step. Scheduled daily since Phase 2, when production began
# rendering the certified tier. Code changes on `preview` block this until
# the owner promotes them.
#
# Promotes only when all of these hold:
#   - `main` is an ancestor of `preview` (fast-forward only)
#   - every file that differs between them is in the data allowlist
#   - the newest commit on `preview` is at least 24 hours old (soak)
#
# Nothing to promote and still soaking are normal states: the run ends green
# with a notice. A non-data change waiting for the owner ends green with a
# warning. Only a broken branch relationship or a failed re-certification
# turns the run red.
#   - a fresh certification of `preview` passes the 100% gate and reproduces
#     exactly the certified values committed there

on:
  schedule:
    - cron: '23 15 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: promote-certified
  cancel-in-progress: false

env:
  DATA_FILES: >-
    web/src/data/generated/edgarFacts.json
    web/src/data/generated/filingEvents.json
    web/src/data/generated/filingEvidence.json
    web/src/data/generated/filingRun.json
    web/src/data/generated/certifiedCoverage.json
    web/src/data/generated/certifiedVerification.json
  SOAK_HOURS: '24'

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.scope.outputs.sha }}
      promote: ${{ steps.scope.outputs.promote }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: preview
          fetch-depth: 0
          persist-credentials: false

      - name: Fast-forward, data-only, soaked
        id: scope
        run: |
          set -euo pipefail
          # fetch-depth: 0 above already fetched origin/main. The repo is private and the
          # checkout keeps no credentials, so a second fetch here would fail.
          git rev-parse --verify -q origin/main >/dev/null || { echo "::error::origin/main missing from the checkout"; exit 1; }
          skip() { echo "$1"; echo "promote=false" >> "$GITHUB_OUTPUT"; exit 0; }
          git merge-base --is-ancestor origin/main HEAD || { echo "::error::main is not an ancestor of preview"; exit 1; }
          changed=$(git diff --no-renames --name-only origin/main HEAD | sort)
          [ -n "$changed" ] || skip "::notice::Nothing to promote: main already matches preview."
          extra=$(comm -23 <(echo "$changed") <(printf '%s\n' $DATA_FILES | sort) || true)
          [ -z "$extra" ] || { echo "$extra"; skip "::warning::preview has non-data changes; the owner must promote them before data can move."; }
          age=$(( ( $(date -u +%s) - $(git log -1 --format=%ct HEAD) ) / 3600 ))
          [ "$age" -ge "$SOAK_HOURS" ] || skip "::notice::Soaking: newest preview commit is $age h old."
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "promote=true" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.scope.outputs.promote == 'true'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Re-certify and require identical values
        if: steps.scope.outputs.promote == 'true'
        working-directory: web
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          cp src/data/generated/certifiedCoverage.json "$RUNNER_TEMP/committed.json"
          npm run certify:sec
          npm run certify:gate
          out=$(node scripts/certify-changed.mjs "$RUNNER_TEMP/committed.json" src/data/generated/certifiedCoverage.json)
          [ "$out" = "changed=false" ] || { echo "Fresh certification differs from preview; wait for the next refresh."; exit 1; }

  promote:
    needs: check
    if: needs.check.outputs.promote == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.check.outputs.sha }}
          fetch-depth: 0
      - name: Fast-forward main to the checked preview commit
        env:
          SHA: ${{ needs.check.outputs.sha }}
        run: git push origin "$SHA:refs/heads/main"
