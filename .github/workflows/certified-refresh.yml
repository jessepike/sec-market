name: certified refresh

# AUTO-002 Phase 1 (D-88, D-96, D-98). Every 4 hours: pull SEC data, re-derive
# every certified claim, run the 100% gate, and if certified values changed,
# push only the allowlisted data files to `preview`. No AI, no secrets, no
# laptop. Production is not touched here (see promote-certified.yml).
#
# Two jobs, two trust levels (council review, AUTO-002):
#   certify  read-only token; runs npm ci and the repo's scripts.
#   publish  write token; runs no npm and no repo code. It only copies the
#            allowlisted files from the certify artifact and pushes.
# A held run (gate below 100%) pushes nothing and opens or updates one issue.

on:
  schedule:
    - cron: '17 */4 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: certified-refresh
  cancel-in-progress: false

env:
  DATA_FILES: >-
    web/src/data/generated/edgarFacts.json
    web/src/data/generated/filingEvents.json
    web/src/data/generated/filingEvidence.json
    web/src/data/generated/filingRun.json
    web/src/data/generated/certifiedCoverage.json
    web/src/data/generated/certifiedVerification.json

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
      complete: ${{ steps.gate.outputs.complete }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: preview
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci --no-audit --no-fund

      - name: Keep the committed certified coverage as the baseline
        run: cp web/src/data/generated/certifiedCoverage.json "$RUNNER_TEMP/baseline-coverage.json"

      - name: Refresh SEC data
        working-directory: web
        run: |
          npm run refresh:edgar
          npm run refresh:filing-events

      - name: Certify
        working-directory: web
        run: npm run certify:sec

      - name: Gate
        id: gate
        working-directory: web
        run: |
          set +e
          npm run certify:gate
          code=$?
          set -e
          if [ "$code" = 0 ]; then echo "complete=true" >> "$GITHUB_OUTPUT"; else echo "complete=false" >> "$GITHUB_OUTPUT"; fi

      - name: Data tests
        if: steps.gate.outputs.complete == 'true'
        working-directory: web
        run: npm run test:data

      - name: Only allowlisted files changed
        run: |
          changed=$(git status --porcelain --untracked-files=all | awk '{print $2}' | sort)
          allowed=$(printf '%s\n' $DATA_FILES | sort)
          extra=$(comm -23 <(echo "$changed") <(echo "$allowed") | grep -v '^$' || true)
          if [ -n "$extra" ]; then echo "Refusing: files outside the allowlist changed:"; echo "$extra"; exit 1; fi

      - name: Did certified values change?
        id: diff
        working-directory: web
        run: node scripts/certify-changed.mjs "$RUNNER_TEMP/baseline-coverage.json" src/data/generated/certifiedCoverage.json >> "$GITHUB_OUTPUT"

      - name: Upload certified data
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: certified-data
          path: |
            web/src/data/generated/edgarFacts.json
            web/src/data/generated/filingEvents.json
            web/src/data/generated/filingEvidence.json
            web/src/data/generated/filingRun.json
            web/src/data/generated/certifiedCoverage.json
            web/src/data/generated/certifiedVerification.json
            .collect/certified-attempt.json
          retention-days: 30
          if-no-files-found: error
          include-hidden-files: true

      - name: Upload raw SEC responses (proof archive)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sec-archive
          path: .collect/sec-archive/
          retention-days: 90
          if-no-files-found: warn
          include-hidden-files: true

  publish:
    needs: certify
    if: needs.certify.outputs.complete == 'true' && needs.certify.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: preview

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: certified-data
          path: ${{ runner.temp }}/certified

      - name: Copy only allowlisted files and push to preview
        run: |
          set -euo pipefail
          for f in $DATA_FILES; do
            src="$RUNNER_TEMP/certified/$f"
            [ -f "$src" ] || { echo "missing $f in artifact"; ls -R "$RUNNER_TEMP/certified"; exit 1; }
            node -e "JSON.parse(require('fs').readFileSync(process.argv[1],'utf8'))" "$src"
            cp "$src" "$f"
          done
          git add $DATA_FILES
          if git diff --cached --quiet; then echo "Nothing to commit."; exit 0; fi
          # Vercel builds only commits whose author maps to the project owner.
          git -c user.name="Jesse Pike" -c user.email="jesse@keatingpike.com" \
            commit -m "data(auto): certified SEC refresh $(date -u +%Y-%m-%dT%H:%MZ)" \
            -m "Automated run of .github/workflows/certified-refresh.yml (run ${GITHUB_RUN_ID}). Gate 100%. No AI, no human step."
          git push origin HEAD:preview

  report:
    needs: [certify, publish]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open, update or close the held-run issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CERTIFY: ${{ needs.certify.result }}
          COMPLETE: ${{ needs.certify.outputs.complete }}
          PUBLISH: ${{ needs.publish.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Certified refresh held"
          existing=$(gh issue list -R "$REPO" --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ "$CERTIFY" = "success" ] && [ "$COMPLETE" = "true" ] && [ "$PUBLISH" != "failure" ]; then
            if [ -n "$existing" ]; then gh issue close "$existing" -R "$REPO" -c "Recovered: $RUN_URL"; fi
            exit 0
          fi
          body="The certified refresh did not complete at 100% or failed. Published data is unchanged. Run: $RUN_URL (certify: $CERTIFY, gate complete: ${COMPLETE:-unknown}, publish: $PUBLISH). The certified-data artifact has .collect/certified-attempt.json with the blockers."
          if [ -n "$existing" ]; then gh issue comment "$existing" -R "$REPO" -b "$body"; else gh issue create -R "$REPO" -t "$title" -b "$body"; fi
