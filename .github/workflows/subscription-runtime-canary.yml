name: subscription runtime canary

# Private hosting and archive integrity only. No market-source requests or model worker.
on:
  push:
    branches: [preview]
    # Cover archive validation and future conditional pipeline imports conservatively.
    paths:
      - 'ops/ci/runtime_canary.py'
      - 'ops/ci/auth_store.py'
      - 'ops/ci/coverage_summary.py'
      - 'ops/ci/test_auth_store.py'
      - 'ops/ci/test_runtime_canary.py'
      - 'web/scripts/pipeline/**'
      - 'contracts/market.json'
      - '.github/workflows/subscription-runtime-canary.yml'
  workflow_dispatch:

permissions: {}
concurrency:
  group: subscription-runtime-canary
  cancel-in-progress: false

jobs:
  private-runner-proof:
    if: github.repository == 'jessepike/sec-market' && github.event.repository.private == true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Verify credential persistence helper using fictional data
        run: python3 -m unittest discover -s ops/ci -p 'test_auth_store.py' -v
      - name: Verify archived evidence integrity from the private GitHub runner without source requests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git --hostname github.com
          python3 ops/ci/runtime_canary.py --root "$RUNNER_TEMP/smp-host-canary" --output "$RUNNER_TEMP/smp-runtime-canary.json"
      - name: Retain bounded nonsecret runtime receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: subscription-runtime-canary
          path: ${{ runner.temp }}/smp-runtime-canary.json
          if-no-files-found: error
          retention-days: 14
