name: bounded subscription collector
# A dispatch from the outside daily clock (Vercel Cron, ops/timer) carries
# timer=true and is titled so the publisher and watchdog can recognise it.
run-name: ${{ github.event_name == 'workflow_dispatch' && inputs.timer && 'daily timer collection' || 'bounded subscription collector' }}

# Collection runs daily; public publication retains its separate cutover gate.
# The outside clock starts it at 05:17 UTC. GitHub's own schedule stays as a
# backup (it is often hours late); any start skips once today has collected.
on:
  schedule:
    - cron: '17 5 * * *'
    - cron: '47 9 * * *'
    # Temporary actual scheduler acceptance. The UTC guard prevents yearly reuse.
    - cron: '7 6 23 10 *'
    - cron: '7 7 23 10 *'
  push:
    branches: [preview]
    paths: ['ops/ci/collection-request.json']
  workflow_dispatch:
    inputs:
      source_probe:
        description: 'Run bounded source diagnostics only (main branch, no collection or publication)'
        type: boolean
        required: false
        default: false
      timer:
        description: 'Daily timer collection (set by the outside clock; counts as the scheduled run)'
        type: boolean
        required: false
        default: false

permissions: {}
concurrency:
  group: sec-market-subscription-account
  cancel-in-progress: false

jobs:
  schedule-guard:
    if: github.repository == 'jessepike/sec-market' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[collect-account]'))
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      actions: read # See whether today's timer collection already succeeded.
    outputs:
      allowed: ${{ steps.guard.outputs.allowed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: guard
        name: Skip expired acceptance crons and timer starts after today's collection
        env:
          GH_TOKEN: ${{ github.token }}
          SMP_EVENT_NAME: ${{ github.event_name }}
          SMP_EVENT_SCHEDULE: ${{ github.event.schedule }}
          SMP_TIMER: ${{ github.event_name == 'workflow_dispatch' && inputs.timer && 'true' || 'false' }}
          SMP_SOURCE_PROBE: ${{ github.event_name == 'workflow_dispatch' && inputs.source_probe && 'true' || 'false' }}
        run: python3 ops/ci/schedule_guard.py
  collect-and-reconcile:
    needs: schedule-guard
    if: needs.schedule-guard.outputs.allowed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read # Evidence goes to the private evidence repository over its deploy key.
      actions: read # Prove an abandoned lease's owning run actually terminated.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Free runner disk for the evidence archive
        # The restored archive and its mirror are about 6.5 GB and grow about
        # 200 MB a day; the runner image leaves about 12 GB free. Deleting the
        # unused Android SDK, .NET and Haskell toolchains frees about 20 GB.
        # It runs in the background so it adds no time to the 35-minute limit.
        continue-on-error: true
        run: |
          df -B1 --output=avail "$RUNNER_TEMP" | tail -1
          nohup sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup >/dev/null 2>&1 &
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Initialize nonsecret setup receipt and install document reader
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          receipt = {'githubRunId': os.environ['GITHUB_RUN_ID'], 'complete': False, 'executionCompleted': False, 'outcome': 'failed',
                     'reason': 'RUNNER_SETUP_NOT_COMPLETED', 'apiFallback': False,
                     'publication': {'published': False, 'reason': 'INITIAL_CUTOVER_NOT_ENABLED'}}
          (Path(os.environ['RUNNER_TEMP']) / 'smp-collection-receipt.json').write_text(json.dumps(receipt, indent=2) + '\n')
          PY
          sudo apt-get update -qq
          sudo apt-get install --yes --no-install-recommends poppler-utils
      - name: Install pinned application and official account client
        if: github.event_name != 'workflow_dispatch' || !inputs.source_probe
        run: |
          npm ci --prefix web --no-audit --no-fund
          npm install --prefix "$RUNNER_TEMP/smp-cli" --no-save --package-lock=false @openai/codex@0.163.0
          echo "$RUNNER_TEMP/smp-cli/node_modules/.bin" >> "$GITHUB_PATH"
          command -v pdftotext
      - name: Verify worker and persistence guards
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 ops/ci/verified_ci_guards.py
      - name: Restore acknowledged evidence, collect bounded deltas and reconcile
        if: github.event_name != 'workflow_dispatch' || !inputs.source_probe
        env:
          GH_TOKEN: ${{ github.token }}
          SMP_EVIDENCE_DEPLOY_KEY: ${{ secrets.SMP_EVIDENCE_DEPLOY_KEY }}
          SMP_CODEX_AUTH_JSON: ${{ secrets.SMP_CODEX_AUTH_JSON }}
          SMP_AUTH_STORE_TOKEN: ${{ secrets.SMP_AUTH_STORE_TOKEN }}
          SMP_EVENT_SCHEDULE: ${{ github.event.schedule }}
          SMP_TIMER: ${{ github.event_name == 'workflow_dispatch' && inputs.timer && 'true' || 'false' }}
        run: |
          gh auth setup-git --hostname github.com
          bash ops/ci/evidence_key.sh
          python3 ops/ci/collect.py --root "$RUNNER_TEMP/smp-collection" --maximum-seconds 1200 --output "$RUNNER_TEMP/smp-collection-receipt.json"
      - name: Flag an expired ChatGPT login for the outside watchdog
        if: always() && (github.event_name != 'workflow_dispatch' || !inputs.source_probe)
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          receipt = Path(os.environ['RUNNER_TEMP']) / 'smp-collection-receipt.json'
          reason = str((json.loads(receipt.read_text()) if receipt.exists() else {}).get('modelUnavailable') or '')
          if reason in ('CHATGPT_SUBSCRIPTION_LOGIN_REQUIRED', 'CHATGPT_SIGN_IN_AGAIN'):
              print('::error title=chatgpt-login::' + reason)
          PY
      - name: Record evidence size and runner free disk for the health check
        if: always() && (github.event_name != 'workflow_dispatch' || !inputs.source_probe)
        continue-on-error: true
        run: |
          archive=$(du -sb "$RUNNER_TEMP/smp-collection" 2>/dev/null | cut -f1)
          free=$(df -B1 --output=avail "$RUNNER_TEMP" | tail -1 | tr -d ' ')
          echo "::notice title=evidence-disk::archive=${archive:-0} free=${free:-0}"
      - name: Probe candidate sources under the acknowledged lease and budget
        if: github.event_name == 'workflow_dispatch' && inputs.source_probe
        env:
          GH_TOKEN: ${{ github.token }}
          SMP_EVIDENCE_DEPLOY_KEY: ${{ secrets.SMP_EVIDENCE_DEPLOY_KEY }}
        run: |
          gh auth setup-git --hostname github.com
          bash ops/ci/evidence_key.sh
          python3 ops/ci/collect.py --source-probe --root "$RUNNER_TEMP/smp-collection" --maximum-seconds 1200 --output "$RUNNER_TEMP/smp-collection-receipt.json"
      - name: Retain only the bounded nonsecret collection receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ github.event_name == 'workflow_dispatch' && inputs.source_probe && 'source-probe-receipt' || 'subscription-collection-receipt' }}
          path: ${{ runner.temp }}/smp-collection-receipt.json
          if-no-files-found: error
          retention-days: 14
      - name: Report failure or recovery to the owner
        if: always() && (github.event_name != 'workflow_dispatch' || !inputs.source_probe)
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: python3 ops/ci/job_alert.py --job collector --status "$JOB_STATUS"
      - name: Remove ephemeral account and evidence files
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/smp-collection"
