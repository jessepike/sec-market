name: bounded subscription collector

# Collection runs daily; public publication retains its separate cutover gate.
on:
  schedule:
    - cron: '17 5 * * *'
    # Temporary actual scheduler acceptance. The UTC guard prevents yearly reuse.
    - cron: '7 6 23 10 *'
    - cron: '7 7 23 10 *'
  push:
    branches: [preview]
    paths: ['ops/ci/collection-request.json']
  workflow_dispatch:
    inputs:
      source_probe:
        description: 'Run bounded source diagnostics only (main branch, no collection or publication)'
        type: boolean
        required: false
        default: false

permissions: {}
concurrency:
  group: sec-market-subscription-account
  cancel-in-progress: false

jobs:
  schedule-guard:
    if: github.repository == 'jessepike/sec-market' && github.event.repository.private == true && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[collect-account]'))
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    outputs:
      allowed: ${{ steps.guard.outputs.allowed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: guard
        name: Restrict the temporary scheduler acceptance to its UTC date
        env:
          SMP_EVENT_NAME: ${{ github.event_name }}
          SMP_EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: python3 ops/ci/schedule_guard.py
  collect-and-reconcile:
    needs: schedule-guard
    if: needs.schedule-guard.outputs.allowed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write # Dedicated evidence ref; this script never writes app branches.
      actions: read # Prove an abandoned lease's owning run actually terminated.
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Initialize nonsecret setup receipt and install document reader
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          receipt = {'githubRunId': os.environ['GITHUB_RUN_ID'], 'complete': False, 'executionCompleted': False, 'outcome': 'failed',
                     'reason': 'RUNNER_SETUP_NOT_COMPLETED', 'apiFallback': False,
                     'publication': {'published': False, 'reason': 'INITIAL_CUTOVER_NOT_ENABLED'}}
          (Path(os.environ['RUNNER_TEMP']) / 'smp-collection-receipt.json').write_text(json.dumps(receipt, indent=2) + '\n')
          PY
          sudo apt-get update -qq
          sudo apt-get install --yes --no-install-recommends poppler-utils
      - name: Install pinned application and official account client
        if: github.event_name != 'workflow_dispatch' || !inputs.source_probe
        run: |
          npm ci --prefix web --no-audit --no-fund
          npm install --prefix "$RUNNER_TEMP/smp-cli" --no-save --package-lock=false @openai/codex@0.163.0
          echo "$RUNNER_TEMP/smp-cli/node_modules/.bin" >> "$GITHUB_PATH"
          command -v pdftotext
      - name: Verify worker and persistence guards
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 ops/ci/verified_ci_guards.py
      - name: Restore acknowledged evidence, collect bounded deltas and reconcile
        if: github.event_name != 'workflow_dispatch' || !inputs.source_probe
        env:
          GH_TOKEN: ${{ github.token }}
          SMP_CODEX_AUTH_JSON: ${{ secrets.SMP_CODEX_AUTH_JSON }}
          SMP_AUTH_STORE_TOKEN: ${{ secrets.SMP_AUTH_STORE_TOKEN }}
          SMP_EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          gh auth setup-git --hostname github.com
          python3 ops/ci/collect.py --root "$RUNNER_TEMP/smp-collection" --maximum-seconds 1200 --output "$RUNNER_TEMP/smp-collection-receipt.json"
      - name: Probe candidate sources under the acknowledged lease and budget
        if: github.event_name == 'workflow_dispatch' && inputs.source_probe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git --hostname github.com
          python3 ops/ci/collect.py --source-probe --root "$RUNNER_TEMP/smp-collection" --maximum-seconds 1200 --output "$RUNNER_TEMP/smp-collection-receipt.json"
      - name: Retain only the bounded nonsecret collection receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ github.event_name == 'workflow_dispatch' && inputs.source_probe && 'source-probe-receipt' || 'subscription-collection-receipt' }}
          path: ${{ runner.temp }}/smp-collection-receipt.json
          if-no-files-found: error
          retention-days: 14
      - name: Report failure or recovery to the owner
        if: always() && (github.event_name != 'workflow_dispatch' || !inputs.source_probe)
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: python3 ops/ci/job_alert.py --job collector --status "$JOB_STATUS"
      - name: Remove ephemeral account and evidence files
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/smp-collection"
