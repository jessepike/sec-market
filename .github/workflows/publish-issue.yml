name: publish issue

# His approval of the weekly issue pull request IS the signature
# (SEC-MARKET-PUBLISH-001 §2). This workflow is kept thin on purpose: it
# resolves which pull request and branch the triggering event is about,
# decides whether the strict conditions below hold, computes the signing
# date, and hands everything else to scripts/publish-issue.sh — the ordered
# steps, every refusal, and the pull request comments all live there so they
# can be run and tested outside GitHub.
#
# Event text (a comment body, a branch name) is untrusted input and is never
# interpolated into a `run:` script directly — it only ever reaches a script
# through `env:`.
#
# Three phases, one token (coordinator review, 2026-09-21, point A). The
# issue branch checked out below is not trusted, so nothing it could
# influence ever runs holding write credentials:
#   guard    pure git plumbing, checked out from the TRUSTED copy of the
#             script, no token, before setup-node/npm ci/Playwright install
#             or anything else from the branch runs.
#   build    merges preview, signs, locks, runs npm test, commits locally.
#             Still no token — this is where the branch's own TypeScript
#             actually executes (the sign step and the test suite import
#             it).
#   release  the only phase with a token. Verifies the trusted checkout is
#             unchanged, then pushes, polls, and comments.
# A guard or build refusal is written to a small state file for the "Post
# the result" step below (which does hold a token) to read and post —
# treated as untrusted text there regardless of which phase wrote it.
#
# Known gap: for the pull_request_review trigger, GitHub reads this workflow
# file itself from the pull request's merge commit, not from the default
# branch — so a branch that rewrote this file could still change what runs
# here before scripts/publish-issue.sh ever gets a say. The `publish` comment
# trigger doesn't have this gap (issue_comment always runs the default
# branch's copy of the workflow). The second, trusted checkout below closes
# a different gap — a branch altering the publisher script itself — and does
# not close this one. Not solved here; recorded so it isn't rediscovered.

on:
  pull_request_review:
    types: [submitted]
  issue_comment:
    types: [created]

# Only one publish at a time, ever — across every event that could trigger
# one. A second approval or a second "publish" comment while one run is still
# signing, testing, or pushing must wait rather than race it.
concurrency:
  group: publish-issue
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      STATE_DIR: ${{ runner.temp }}/publish-state
    steps:
      # Coarse, cheap, no checkout: skip immediately for anyone but the
      # owner. For an owner-authored comment on an issue/*->preview pull
      # request, head/base are resolved BEFORE the comment wording is
      # checked (coordinator review point G, 2026-09-21) — so a wrong-
      # wording comment or an unapproved review on a real publish attempt
      # still gets a reason posted on the pull request; a stranger's comment
      # or an unrelated pull request stays silent either way.
      - name: Resolve the event and check every condition
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          REPO_OWNER: ${{ github.repository_owner }}
          REVIEW_STATE: ${{ github.event.review.state }}
          REVIEW_COMMIT_SHA: ${{ github.event.review.commit_id }}
          REVIEW_BODY: ${{ github.event.review.body }}
          PR_NUMBER_REVIEW: ${{ github.event.pull_request.number }}
          PR_HEAD_REF_REVIEW: ${{ github.event.pull_request.head.ref }}
          PR_BASE_REF_REVIEW: ${{ github.event.pull_request.base.ref }}
          IS_PULL_REQUEST_COMMENT: ${{ github.event.issue.pull_request != null }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_TIMESTAMP: ${{ github.event.comment.created_at }}
          PR_NUMBER_COMMENT: ${{ github.event.issue.number }}
          GH_TOKEN: ${{ github.token }}
          # gh pr view below runs before this job checks anything out, so it
          # has no git remote to infer a repository from — without this it
          # fails and the `publish` comment path never resolves a PR.
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          reason=""
          pr_number=""
          head_branch=""
          base_branch=""
          approved_sha=""
          comment_created_at_epoch=""

          if [ "$ACTOR" != "$REPO_OWNER" ]; then
            reason="actor \"$ACTOR\" is not the repository owner"
          elif [ "$EVENT_NAME" = "pull_request_review" ]; then
            pr_number="$PR_NUMBER_REVIEW"
            head_branch="$PR_HEAD_REF_REVIEW"
            base_branch="$PR_BASE_REF_REVIEW"
            # The review's own commit_id is exactly the commit he approved —
            # no extra call needed for this trigger, and no race window: it
            # is captured atomically with the approval itself.
            approved_sha="$REVIEW_COMMIT_SHA"
            if [ "$REVIEW_STATE" != "approved" ]; then
              reason="review state is \"$REVIEW_STATE\", not approved"
            fi
          elif [ "$EVENT_NAME" = "issue_comment" ]; then
            if [ "$IS_PULL_REQUEST_COMMENT" != "true" ]; then
              reason="the comment is not on a pull request"
            else
              pr_number="$PR_NUMBER_COMMENT"
              pr_json="$(gh pr view "$pr_number" --json headRefName,baseRefName,headRefOid)"
              head_branch="$(printf '%s' "$pr_json" | jq -r '.headRefName')"
              base_branch="$(printf '%s' "$pr_json" | jq -r '.baseRefName')"
              # A "publish" comment has no commit_id of its own — sign
              # exactly what the branch tip was at the moment this gate
              # ran, read fresh from the PR rather than trusted from the
              # comment event. The guard phase double-checks this wasn't
              # already stale when the comment was WRITTEN (point D below).
              approved_sha="$(printf '%s' "$pr_json" | jq -r '.headRefOid')"
              comment_created_at_epoch="$(date -d "$COMMENT_TIMESTAMP" +%s)"

              # Exact match, trimmed and lower-cased (coordinator review
              # point I, 2026-09-21) — "publish" or "publish reconfirm",
              # nothing else. The comment body is untrusted; it only ever
              # reaches a `case` pattern match here, never a command.
              trimmed_body="$(printf '%s' "$COMMENT_BODY" | tr '[:upper:]' '[:lower:]' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
              case "$trimmed_body" in
                publish|"publish reconfirm") : ;;
                *) reason="the comment is not exactly \"publish\" or \"publish reconfirm\" (got \"$COMMENT_BODY\")" ;;
              esac
            fi
          else
            reason="unsupported event \"$EVENT_NAME\""
          fi

          # Whether this looks like a genuine publish attempt worth telling
          # him about on the pull request even when it fails for some OTHER
          # reason (coordinator review point G, 2026-09-21): the actor is
          # the owner and the resolved pull request is issue/*->preview.
          # Silent for every other actor and every other pull request.
          head_base_ok="false"
          case "$head_branch" in
            issue/*) [ "$base_branch" = "preview" ] && head_base_ok="true" ;;
          esac
          looks_like_publish_attempt="false"
          if [ "$ACTOR" = "$REPO_OWNER" ] && [ "$head_base_ok" = "true" ]; then
            looks_like_publish_attempt="true"
          fi

          if [ -z "$reason" ] && [ "$head_base_ok" != "true" ]; then
            if [ -z "$head_branch" ]; then
              reason="could not resolve a head branch"
            elif [ "$base_branch" != "preview" ]; then
              reason="base branch \"$base_branch\" is not preview"
            else
              reason="head branch \"$head_branch\" does not match issue/*"
            fi
          fi

          # RECONFIRM: computed here, from untrusted event text, and passed
          # through as a plain env var. Logged by the script; nothing else
          # reads it yet (coordinator review point I, 2026-09-21 — a later
          # task wires it up).
          reconfirm="false"
          if [ "$EVENT_NAME" = "issue_comment" ] && [ "${trimmed_body:-}" = "publish reconfirm" ]; then
            reconfirm="true"
          elif [ "$EVENT_NAME" = "pull_request_review" ]; then
            review_body_lower="$(printf '%s' "$REVIEW_BODY" | tr '[:upper:]' '[:lower:]')"
            case "$review_body_lower" in
              *reconfirm*) reconfirm="true" ;;
            esac
          fi
          echo "reconfirm=$reconfirm" >> "$GITHUB_OUTPUT"

          if [ -n "$reason" ]; then
            echo "not eligible: $reason"
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            if [ "$looks_like_publish_attempt" = "true" ] && [ -n "$pr_number" ]; then
              gh pr comment "$pr_number" --body "Not publishing: $reason" || echo "gate: warning — gh pr comment failed" >&2
            fi
            exit 0
          fi

          echo "eligible, pull request #$pr_number, head $head_branch, base $base_branch, approved $approved_sha"
          {
            echo "eligible=true"
            echo "pr_number=$pr_number"
            echo "head_branch=$head_branch"
            echo "approved_sha=$approved_sha"
            echo "comment_created_at_epoch=$comment_created_at_epoch"
          } >> "$GITHUB_OUTPUT"

      # The signature is his approval "today" — today in his timezone, at the
      # moment of that approval, never the date this job happens to run.
      - name: Compute the signing date (America/Los_Angeles)
        id: signed
        if: steps.gate.outputs.eligible == 'true'
        env:
          EVENT_NAME: ${{ github.event_name }}
          REVIEW_TIMESTAMP: ${{ github.event.review.submitted_at }}
          COMMENT_TIMESTAMP: ${{ github.event.comment.created_at }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request_review" ]; then
            timestamp="$REVIEW_TIMESTAMP"
          else
            timestamp="$COMMENT_TIMESTAMP"
          fi
          signed_on="$(TZ='America/Los_Angeles' date -d "$timestamp" +%Y-%m-%d)"
          echo "signed_on=$signed_on" >> "$GITHUB_OUTPUT"

      # A second, separate checkout of `preview` — the branch he doesn't
      # control by pushing an issue branch — holding just scripts/. Moved to
      # run BEFORE the issue-branch checkout (coordinator review point A(2),
      # 2026-09-21): every phase below runs THIS copy of publish-issue.sh,
      # never the issue branch's own, so a branch cannot rewrite the script
      # that decides how it gets published. See the "Known gap" note at the
      # top of this file for what this does not cover.
      - name: Check out the trusted publisher script from preview
        if: steps.gate.outputs.eligible == 'true'
        uses: actions/checkout@v4
        with:
          ref: preview
          path: trusted
          sparse-checkout: scripts

      - name: Record the trusted checkout's commit
        id: trusted_sha
        if: steps.gate.outputs.eligible == 'true'
        run: echo "sha=$(git -C trusted rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # persist-credentials: false (coordinator review point A(1),
      # 2026-09-21) — this checkout, and everything the branch could
      # influence that runs against it, never has push credentials sitting
      # in .git/config. Only the release phase, far below, authenticates a
      # push at all, and only with an explicit per-push header.
      - name: Check out the issue branch
        if: steps.gate.outputs.eligible == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.gate.outputs.head_branch }}
          fetch-depth: 0
          persist-credentials: false

      # Guard: pure git plumbing, no token, before setup-node/npm ci/
      # Playwright install or anything else from the branch runs
      # (coordinator review point A(2), 2026-09-21).
      - name: Guard
        id: guard
        if: steps.gate.outputs.eligible == 'true'
        env:
          PHASE: guard
          HEAD_BRANCH: ${{ steps.gate.outputs.head_branch }}
          SIGNED_ON: ${{ steps.signed.outputs.signed_on }}
          PR_NUMBER: ${{ steps.gate.outputs.pr_number }}
          APPROVED_SHA: ${{ steps.gate.outputs.approved_sha }}
          COMMENT_CREATED_AT: ${{ steps.gate.outputs.comment_created_at_epoch }}
          RECONFIRM: ${{ steps.gate.outputs.reconfirm }}
        run: ./trusted/scripts/publish-issue.sh --phase guard

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.eligible == 'true' && success()
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        if: steps.gate.outputs.eligible == 'true' && success()
        working-directory: web
        run: npm ci

      - name: Install Playwright's Chromium
        if: steps.gate.outputs.eligible == 'true' && success()
        working-directory: web
        run: npx playwright install --with-deps chromium

      # Build: merges preview, signs, locks, runs npm test, commits locally.
      # Still no token (coordinator review point A(3), 2026-09-21) — this is
      # where the branch's own TypeScript actually executes, in the sign
      # step and in the test suite's imports.
      - name: Build
        id: build
        if: steps.gate.outputs.eligible == 'true' && success()
        env:
          PHASE: build
          HEAD_BRANCH: ${{ steps.gate.outputs.head_branch }}
          SIGNED_ON: ${{ steps.signed.outputs.signed_on }}
          PR_NUMBER: ${{ steps.gate.outputs.pr_number }}
        run: ./trusted/scripts/publish-issue.sh --phase build

      - name: Post the result of a failed guard or build phase
        if: always() && (steps.guard.outcome == 'failure' || steps.build.outcome == 'failure')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.gate.outputs.pr_number }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        run: |
          set -euo pipefail
          result_file="$STATE_DIR/phase-result.txt"
          if [ -f "$result_file" ]; then
            # Untrusted no matter which phase wrote it — a compromised
            # branch could poison this during the build phase (coordinator
            # review point A, 2026-09-21). Truncated and posted in a code
            # block rather than trusted as-is.
            body="$(tail -c 4000 "$result_file")"
          else
            failed_phase="guard"
            [ "$BUILD_OUTCOME" = "failure" ] && failed_phase="build"
            body="the $failed_phase phase failed with no result file — see the Actions log for this run"
          fi
          if [ -n "$PR_NUMBER" ]; then
            gh pr comment "$PR_NUMBER" --body "$(printf 'Publish failed.\n\n```\n%s\n```' "$body")" || echo "warning — gh pr comment failed" >&2
          fi

      - name: Comment that the issue is already published
        if: steps.build.outputs.outcome == 'already-published'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.gate.outputs.pr_number }}
        run: |
          set -euo pipefail
          gh pr comment "$PR_NUMBER" --body "Already published — there was nothing to sign. If this issue needs republishing, that is a separate, deliberate step."

      # Release: the only phase with a token. Verifies trusted/ is still
      # exactly what was checked out above, then pushes preview, then the
      # issue branch, then main (coordinator review point H, 2026-09-21),
      # polls the live site, and comments.
      - name: Release
        id: release
        if: steps.gate.outputs.eligible == 'true' && success() && steps.build.outputs.outcome != 'already-published'
        env:
          PHASE: release
          HEAD_BRANCH: ${{ steps.gate.outputs.head_branch }}
          SIGNED_ON: ${{ steps.signed.outputs.signed_on }}
          PR_NUMBER: ${{ steps.gate.outputs.pr_number }}
          TRUSTED_SHA_EXPECTED: ${{ steps.trusted_sha.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          AUTHOR_NAME: Jesse Pike
          AUTHOR_EMAIL: jesse@keatingpike.com
        # Runs the trusted copy of the script (checked out from `preview`
        # above, into ./trusted/), with the working directory still the
        # issue-branch checkout at $GITHUB_WORKSPACE — WEB_DIR ("web",
        # default) resolves against that, not against trusted/.
        run: ./trusted/scripts/publish-issue.sh --phase release
