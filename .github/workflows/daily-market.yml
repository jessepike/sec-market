name: daily market collection (activation required)

# This is collection ONLY. It cannot publish data or establish release provenance.
# Scheduled workflows run from main. No fork/PR triggers on the subscription host.
on:
  schedule:
    - cron: '17 12 * * *'
  workflow_dispatch:

permissions: {}
concurrency:
  group: daily-market-collection
  cancel-in-progress: false

jobs:
  collect:
    if: vars.MARKET_PIPELINE_ENABLED == 'true'
    runs-on: [self-hosted, linux, smp-subscription]
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Verify isolated host and persistent state
        env:
          MARKET_STATE_DIR: ${{ vars.MARKET_STATE_DIR }}
        run: |
          set -eu
          test -n "$MARKET_STATE_DIR"
          test "${MARKET_STATE_DIR#/}" != "$MARKET_STATE_DIR"
          test -d "$MARKET_STATE_DIR"
          test -w "$MARKET_STATE_DIR"
          python3 -c 'import os,pathlib; p=pathlib.Path(os.environ["MARKET_STATE_DIR"]).resolve(); w=pathlib.Path(os.environ["GITHUB_WORKSPACE"]).resolve(); assert not p.is_relative_to(w), "State must survive checkout cleanup"'
          node -e 'if(process.versions.node.split(".")[0]!=="22")process.exit(1)'
          codex --version
          codex login status
      - name: Install exact repository dependencies
        working-directory: web
        run: npm ci --no-audit --no-fund
      - name: Collect and reconcile all required sources
        id: collect
        env:
          MARKET_STATE_DIR: ${{ vars.MARKET_STATE_DIR }}
        run: python3 web/scripts/pipeline/cli.py run --state "$MARKET_STATE_DIR" --subscription-worker
      - name: Write matrix even when collection is incomplete
        if: always()
        env:
          MARKET_STATE_DIR: ${{ vars.MARKET_STATE_DIR }}
        run: |
          set -eu
          test -n "$MARKET_STATE_DIR"
          python3 web/scripts/pipeline/cli.py report --state "$MARKET_STATE_DIR" --destination "$RUNNER_TEMP/daily-market-report"
      - name: Recheck archived receipts in a fresh process without invoking a model
        if: always()
        env:
          MARKET_STATE_DIR: ${{ vars.MARKET_STATE_DIR }}
        run: |
          set -eu
          test -n "$MARKET_STATE_DIR"
          python3 web/scripts/pipeline/cli.py verify --state "$MARKET_STATE_DIR"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: daily-market-coverage
          path: ${{ runner.temp }}/daily-market-report
          if-no-files-found: error
          retention-days: 30

# A skipped job is NOT a health signal. An outside watchdog must alert if the
# pinned required coverage receipt is absent/old/incomplete, including a host
# that never accepts this job. Enable only after the runbook's activation gates.
