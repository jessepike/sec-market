name: web

on:
  push:
    # main is a fast-forward of preview, so its commit already has a passing preview
    # run (ops/ci/verified_ci_guards.py accepts either); a second run on main only
    # spent Actions minutes.
    branches: [preview]
    paths: ['web/**', 'contracts/**', 'ops/**', '.github/workflows/web.yml']
  pull_request:
    paths: ['web/**', 'contracts/**', 'ops/**', '.github/workflows/web.yml']

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Verify all operational guards for exact code
        working-directory: .
        run: python3 -m unittest discover -s ops/ci -p 'test_*.py' -v
      - name: Verify the weekly funding collector
        working-directory: .
        run: python3 -m unittest discover -s ops/funding -p 'test_*.py' -v
      - name: Verify the outside timer, watchdog and health check
        working-directory: ops/timer
        run: npm test
      - run: npm test
      - name: Capture production and the tested build at both review widths
        run: |
          node --input-type=module - <<'JS'
          import { spawn, execFile } from 'node:child_process'
          import { promisify } from 'node:util'
          import { mkdir } from 'node:fs/promises'
          import { join } from 'node:path'
          const directory = join(process.env.RUNNER_TEMP, 'visual-review')
          await mkdir(directory)
          const server = spawn(process.execPath, ['scripts/serve-built.mjs'], { stdio: 'inherit' })
          try {
            let ready = false
            for (let attempt = 0; attempt < 100; attempt++) {
              try { ready = (await fetch('http://127.0.0.1:4173/')).ok } catch {}
              if (ready) break
              await new Promise(resolve => setTimeout(resolve, 100))
            }
            if (!ready) throw new Error('Visual review server did not start')
            for (const [url, label] of [['https://securitymarketpulse.com/', 'production'], ['http://127.0.0.1:4173/', 'tested-build']]) {
              const result = await promisify(execFile)(process.execPath, ['scripts/shot.mjs', url, join(directory, label)], { timeout: 180000 })
              process.stdout.write(result.stdout)
            }
          } finally { server.kill('SIGTERM') }
          JS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-review
          path: ${{ runner.temp }}/visual-review/*.png
          if-no-files-found: error
          retention-days: 14
