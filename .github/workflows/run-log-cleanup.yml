name: run log cleanup

# One-time cleanup before this repository goes public (owner approved 2026-11-09).
# Erases the logs and artifacts of every completed run created before the cutoff in
# ops/ci/log-cleanup-request.json, because those logs print ids of the old evidence
# archive. Run records and pass/fail history stay. Gate artifacts (daily-market-gate)
# are kept because the publisher and preview builds read them; they expire in 7 days.
# Remove this workflow after the flip.
on:
  push:
    branches: [preview]
    paths: ['ops/ci/log-cleanup-request.json']

permissions: {}
concurrency:
  group: run-log-cleanup
  cancel-in-progress: false

jobs:
  erase:
    if: github.repository == 'jessepike/sec-market'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: ops/ci/log-cleanup-request.json
          sparse-checkout-cone-mode: false
      - name: Erase logs and artifacts of runs before the cutoff
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SELF: ${{ github.run_id }}
        run: |
          set -euo pipefail
          cutoff=$(jq -er '.cutoff | select(test("^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$"))' ops/ci/log-cleanup-request.json)
          min_id=$(jq -r '.minRunId // 0' ops/ci/log-cleanup-request.json)
          gh api --paginate "repos/$REPO/actions/runs?per_page=100&created=%3C$cutoff" \
            -q ".workflow_runs[] | select(.status == \"completed\" and .id >= $min_id) | .id" | sort -n -u > runs.txt
          last=none
          # GITHUB_TOKEN allows about 1,000 API requests an hour; stop well short and let a
          # second run finish the rest.
          logs=0; gone=0; failed=0; calls=0; budget=850
          while read -r id; do
            [ "$id" = "$SELF" ] && continue
            [ "$calls" -ge "$budget" ] && break
            calls=$((calls+1)); last=$id
            if gh api -X DELETE "repos/$REPO/actions/runs/$id/logs" > /dev/null 2> err.txt; then code=204
            else code=$(grep -oE 'HTTP [0-9]{3}' err.txt | head -1 | cut -d' ' -f2); fi
            case "$code" in 204) logs=$((logs+1));; 404|410) gone=$((gone+1));; *) failed=$((failed+1)); echo "logs $id: ${code:-error}";; esac
          done < runs.txt
          gh api --paginate "repos/$REPO/actions/artifacts?per_page=100" \
            -q ".artifacts[] | select(.created_at < \"$cutoff\" and .name != \"daily-market-gate\") | .id" > artifacts.txt
          arts=0
          while read -r id; do
            [ "$calls" -ge "$budget" ] && break
            calls=$((calls+1))
            if gh api -X DELETE "repos/$REPO/actions/artifacts/$id" --silent; then arts=$((arts+1)); else failed=$((failed+1)); echo "artifact $id failed"; fi
          done < artifacts.txt
          echo "runs=$(wc -l < runs.txt) logsErased=$logs alreadyGone=$gone artifactsErased=$arts failed=$failed lastRunId=$last cutoff=$cutoff"
          [ "$calls" -lt "$budget" ] || echo "::warning title=run-log-cleanup::Request budget reached; push a new request with minRunId above lastRunId"
          [ "$failed" -eq 0 ]
