<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Security Market Pulse — a facts-only supplier tracker</title>
    <meta
      name="description"
      content="Sourced facts about the business of the security market: who is growing, stalling, consolidating, being bought, or in financial trouble. Collected, checked and published automatically, with no stances, rankings or forecasts."
    />
    <link rel="canonical" href="https://securitymarketpulse.com/" />
    <meta name="theme-color" content="#ffffff" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Security Market Pulse" />
    <meta property="og:url" content="https://securitymarketpulse.com/" />
    <meta property="og:title" content="Security Market Pulse — a facts-only supplier tracker" />
    <meta
      property="og:description"
      content="Sourced facts about the business of the security market: who is growing, stalling, consolidating, being bought, or in financial trouble. Collected, checked and published automatically, with no stances, rankings or forecasts."
    />
    <!-- public/og.png is rendered from assets-src/og.svg (node assets-src/render-og.mjs). The
         build fails if the card or the alt text below drops the current SITE_HEADLINE. -->
    <meta property="og:image" content="https://securitymarketpulse.com/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Security Market Pulse. Who grew. Who raised. Who bought. Who cut. Reported revenue, funding, acquisitions, restructuring, debt and leadership changes. Every figure keeps its period and source."
    />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Security Market Pulse — a facts-only supplier tracker" />
    <meta
      name="twitter:description"
      content="Sourced facts about the business of the security market: who is growing, stalling, consolidating, being bought, or in financial trouble. Collected, checked and published automatically, with no stances, rankings or forecasts."
    />
    <meta name="twitter:image" content="https://securitymarketpulse.com/og.png" />
    <meta
      name="twitter:image:alt"
      content="Security Market Pulse. Who grew. Who raised. Who bought. Who cut. Reported revenue, funding, acquisitions, restructuring, debt and leadership changes. Every figure keeps its period and source."
    />

    <!-- schema.org JSON-LD is injected at the end of the head at build time by
         scripts/generate-seo.ts, so datePublished / dateModified and the headline
         always track src/data/meta.ts and src/data/market.ts. Do not hand-write it
         here, and do not write a literal head-closing tag anywhere in this file
         except the real one below: both Vite and the SEO step anchor on it. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
