<?xml version="1.0" encoding="UTF-8"?>
<!--
  Source for web/public/og.png (1200x630 Open Graph / Twitter card).

  Every string in this file is copied from the live front page:
    - headline       -> SITE_HEADLINE in src/data/meta.ts
    - description    -> the masthead description in src/components/SiteMasthead.tsx
  The card carries no number and no date, so it does not go stale when
  coverage grows. Do not add a figure, stance, ranking or forecast here.

  scripts/generate-seo.ts fails the build if this file stops containing
  SITE_HEADLINE. Regenerate public/og.png after editing, from web/:

      node assets-src/render-og.mjs

  That script rasterizes this file with the Chromium that Playwright already
  installs for the e2e suite, so no image dependency is added to package.json.
-->
<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1200"
  height="630"
  viewBox="0 0 1200 630"
  font-family="'IBM Plex Sans', system-ui, sans-serif"
>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Archivo:wght@800&amp;family=IBM+Plex+Mono:wght@500;600&amp;family=IBM+Plex+Sans:wght@400&amp;display=swap');
  </style>

  <!-- Page ground -->
  <rect width="1200" height="630" fill="#f7f7f5" />

  <!-- Masthead row -->
  <rect x="72" y="62" width="26" height="26" rx="6.5" fill="#12161c" />
  <text
    x="112"
    y="83"
    font-family="'IBM Plex Mono', ui-monospace, monospace"
    font-size="18"
    font-weight="600"
    letter-spacing="2.5"
    fill="#12161c"
  >SECURITY MARKET PULSE</text>
  <rect x="72" y="112" width="1056" height="1" fill="#d6d9de" />

  <!-- Headline: SITE_HEADLINE, one sentence pair per line -->
  <g
    font-family="Archivo, system-ui, sans-serif"
    font-size="84"
    font-weight="800"
    letter-spacing="-2.4"
    fill="#12161c"
  >
    <text x="68" y="232">Who grew. Who raised.</text>
    <text x="68" y="324">Who bought. Who cut.</text>
  </g>

  <!-- Masthead description -->
  <text x="72" y="398" font-size="24" font-weight="400" fill="#3a424e">
    Reported revenue, funding, acquisitions, restructuring, debt and leadership changes.
  </text>
  <text x="72" y="434" font-size="24" font-weight="400" fill="#3a424e">
    Every figure keeps its period and source.
  </text>

  <!-- Footer band -->
  <rect x="0" y="510" width="1200" height="120" fill="#12161c" />
  <text
    x="72"
    y="577"
    font-family="'IBM Plex Mono', ui-monospace, monospace"
    font-size="15"
    font-weight="500"
    letter-spacing="1.8"
    fill="#a7b0bc"
  >FACTS ONLY · PUBLIC SOURCES · NOT INVESTMENT ADVICE</text>
  <text
    x="1128"
    y="577"
    text-anchor="end"
    font-family="'IBM Plex Mono', ui-monospace, monospace"
    font-size="18"
    font-weight="500"
    letter-spacing="0.6"
    fill="#ffffff"
  >securitymarketpulse.com</text>
</svg>
